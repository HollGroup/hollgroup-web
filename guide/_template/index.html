/* =====================================================================
   PROPERTY SETTINGS: this is the ONLY part you edit for each property.
   Keep the quotes. Anything left in [SQUARE BRACKETS] shows highlighted.
   Any text can also be given per language, for example:
     bins: { en: "Bins are by the gate.", es: "Los cubos están junto a la puerta." }
   Languages without their own text show the English one.
   ===================================================================== */
const CONFIG = {
  propertyName: "[PROPERTY NAME]",
  area: "[AREA], Birmingham",

  propertyType: "flat",          // "flat" or "house"
  garden: false,                 // true or false (houses only)
  exteriorCameras: false,        // true if a house has exterior cameras

  entry: "lockbox",              // "lockbox" or "smartlock"
  smartLockCodeTimeLimited: true,
  smartLockHowTo: "[PROPERTY: how to use the keypad]",

  parking: "available",          // "available" or "none"
  parkingDetails: "[PROPERTY: where to park, space number or permit details]",
  parkingNearby: "[PROPERTY: nearest car parks, distance and approximate price]",  // also shown as "second car" advice when parking is available
  parkingCoords: "",             // optional: our car park entrance (coordinates or Google Maps link)
  parkingNearbyCoords: "",       // optional: car park link or coordinates
  parkingPhotos: [               // optional: photos of the car park entrance or signs
    // { img: "https://res.cloudinary.com/...", caption: "[WHAT THE PHOTO SHOWS]" }
  ],

  directions: "[PROPERTY: directions, nearest transport]",
  entranceCoords: "",            // coordinates "52.4796, -1.9026" or a Google Maps link
  lockboxCoords: "",             // recommended: leave empty, send it in the check-in message
  keysFirst: false,              // true if the lockbox is NOT at the building: guests are told to collect the keys first
  keysFirstWhere: "",            // e.g. "Washington Street" (general area only)
  lockboxAreaPhoto: "",          // optional: Cloudinary link to a photo of the GENERAL area only, never the exact spot or the code
  keysNote: "",                  // optional: extra note about keys, e.g. replacement cost of a key card

  // Optional step by step routes with photos. Leave steps empty to hide them.
  // Photo links: Cloudinary, ideally with c_limit,w_900,f_auto,q_auto in the link.
  arrivalRoute: { title: "", steps: [
    // { text: "[STEP: what to do]", imgs: ["https://res.cloudinary.com/..."] }
  ] },
  binsRoute: { title: "", steps: [
    // { text: "[STEP: how to reach the bins]", imgs: [] }
  ] },

  checkIn: "15:00",
  checkOut: "10:00",

  wifiName: "[WIFI NAME]",
  wifiPassword: "[WIFI PASSWORD]",

  property: [
    { title: "Heating", text: "[PROPERTY: how the heating works]" },
    { title: "Hot water", text: "[PROPERTY: hot water]" },
    { title: "Kitchen and appliances", text: "[PROPERTY: oven, hob, washing machine, dishwasher]",
      // optional step by step guides, one per appliance (see Digbeth One for a full example):
      // appliances: [ { name: "Oven", brand: "Zanussi", model: "", manual: "https://...", steps: { en: ["Step 1", "Step 2"] }, tip: "" } ]
    },
    { title: "TV", text: "[PROPERTY: TV, apps, remote]" }
  ],

  bins: "[PROPERTY: where to put bins, collection day]",
  fireDetails: "[PROPERTY: alarm locations, exit route, assembly point, extinguisher or fire blanket if present]",
  routerLocation: "[PROPERTY: router location]",
  heatingCheck: "[PROPERTY: how it works and what to check]",
  routerLocked: false,          // true if the router is in a locked room
  utilitiesLocked: false,       // true if router, stopcock and fuse box are in a locked room
  stopcock: "[PROPERTY: water stopcock location]",
  fuseBox: "[PROPERTY: fuse box location]",
  // One pharmacy, or several: [ { name: "...", coords: "..." }, { name: "...", coords: "..." } ]
  pharmacy: { name: "[NEAREST PHARMACY]", coords: "" },
  pharmacyNote: "",              // optional, e.g. how to get there
  // One A&E, or several, like pharmacy
  hospital: { name: "[NEAREST A&E]", coords: "" },
  hospitalNote: "",              // optional, e.g. travel times, children's hospital
  securing: "[PROPERTY: how to secure the property when leaving]",

  // category: "eat", "coffee", "drinks", "essentials" or "see"
  // coords: coordinates, a Google Maps link, or just the place name and city. walkMins is optional.
  picksImage: "",               // optional: Cloudinary link to a "what's on your doorstep" map or poster
  picks: [
    { category: "eat", name: "[PLACE]", note: "[WHY YOU LIKE IT]", walkMins: 5, coords: "" },
    { category: "eat", name: "[PLACE]", note: "[WHY YOU LIKE IT]", walkMins: 5, coords: "" },
    { category: "coffee", name: "[PLACE]", note: "[WHY YOU LIKE IT]", walkMins: 5, coords: "" },
    { category: "essentials", name: "[SUPERMARKET]", note: "[OPENING HOURS]", walkMins: 5, coords: "" }
  ],

  // Extra warnings for the "Important" block, e.g. a door that does not lock by itself
  importantExtra: [
    // { title: "[WARNING TITLE]", text: "[WARNING TEXT]" }
  ],

  discountUrl: "https://booking.hollgroup.co.uk/?coupon=5REPEATING&utm=guide",
  discountCode: "5REPEATING"
};
/* ===================== END OF PROPERTY SETTINGS ===================== */
</script>
